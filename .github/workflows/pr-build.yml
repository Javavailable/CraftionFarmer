name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Locate and audit final plugin JAR
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jar_candidates < <(
            find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' -print | sort
          )

          if [ "${#jar_candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one final plugin JAR, found ${#jar_candidates[@]}." >&2
            printf 'Candidate: %s\n' "${jar_candidates[@]}" >&2
            exit 1
          fi

          jar_path="${jar_candidates[0]}"
          if [ ! -r "$jar_path" ]; then
            echo "Final plugin JAR is not readable: $jar_path" >&2
            exit 1
          fi

          jar_contents="target/final-plugin-jar-contents.txt"
          jar tf "$jar_path" > "$jar_contents"

          if [ -d target/test-classes ]; then
            while IFS= read -r test_class; do
              if grep -Fqx "$test_class" "$jar_contents"; then
                echo "Test class leaked into final plugin JAR: $test_class" >&2
                exit 1
              fi
            done < <(find target/test-classes -type f -name '*.class' -printf '%P\n' | sort)
          fi

          if grep -Eq '^org/junit/' "$jar_contents"; then
            echo "JUnit classes leaked into final plugin JAR." >&2
            exit 1
          fi

          if grep -Eq '^org/opentest4j/' "$jar_contents"; then
            echo "OpenTest4J classes leaked into final plugin JAR." >&2
            exit 1
          fi

          jar_sha256="$(sha256sum "$jar_path" | awk '{print $1}')"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "jar_sha256=$jar_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload final plugin JAR
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: craftionfarmer-${{ github.sha }}
          path: ${{ steps.artifact.outputs.jar_path }}
          if-no-files-found: error

      - name: Write artifact summary
        shell: bash
        run: |
          {
            echo "### PR Build artifact"
            echo "- JAR: \`${{ steps.artifact.outputs.jar_path }}\`"
            echo "- SHA-256: \`${{ steps.artifact.outputs.jar_sha256 }}\`"
            echo "- Artifact: \`craftionfarmer-${{ github.sha }}\`"
            echo "- Upload digest: \`${{ steps.upload.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
